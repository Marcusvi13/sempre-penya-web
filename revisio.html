<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Revisió de notícies · Sempre Penya</title>
<style>
body{font:17px/1.6 system-ui,sans-serif;color:#182820;background:#f5f7f5;margin:0}
main{max-width:760px;margin:32px auto;padding:24px;background:white;border-radius:16px}
h1{font-size:25px;line-height:1.3}h2{font-size:19px}a{color:#086735;overflow-wrap:anywhere}
label{display:block;margin:18px 0}button{font:inherit;border:0;border-radius:8px;padding:12px 18px;cursor:pointer;margin:6px 8px 6px 0;background:#086735;color:white}
button.secondary{background:#e7ece8;color:#182820}button:disabled{opacity:.5;cursor:default}
.note{color:#526257}.reason{background:#f1f4ed;padding:15px;border-left:4px solid #617f42}
#error{color:#9c2525}#state{font-weight:600}#matches{padding:16px;background:#fff7e2}
@media(max-width:600px){main{margin:0;border-radius:0;padding:20px}}
</style></head><body><main>
<p class="note">SEMPRE PENYA · Revisió privada</p><h1 id="title">Carregant la notícia…</h1>
<p id="meta"></p><p id="dates" class="note"></p><p id="context"></p>
<p><a id="article" target="_blank" rel="noopener noreferrer">Obre la font original</a></p>
<p class="reason" id="reason"></p><div id="matches" hidden><h2>Notícies que poden coincidir</h2><div id="matchlist"></div>
<label><input id="confirm" type="checkbox"> He revisat les coincidències i vull publicar aquesta peça igualment.</label></div>
<p id="state" role="status"></p><p id="error" role="alert"></p>
<div id="actions" hidden><button id="publish">Publica-la</button><button id="discard" class="secondary">Mantén descartada</button></div>
<p class="note">La decisió s’aplica a aquesta peça. No modifica automàticament els criteris generals del radar.</p>
</main><script>
const endpoint="https://busuaaaamcojjtavhrne.supabase.co/functions/v1/radar-discard-review";
const [id,token,directAction]=location.hash.slice(1).split(".");
const $=id=>document.getElementById(id);
function date(value){return value?new Date(value).toLocaleString("ca-ES",{timeZone:"Europe/Madrid"}):"Desconeguda"}
function link(node,url){try{const u=new URL(url);if(!["https:","http:"].includes(u.protocol))throw 0;node.href=u.href;node.hidden=false}catch{node.hidden=true}}
function render(data){
 $("title").textContent=data.title;$("meta").textContent=data.source;
 $("dates").textContent="Publicada: "+date(data.published_at)+" · Primer descart: "+date(data.first_detected_at);
 $("context").textContent=data.context||"";$("reason").textContent="Motiu: "+data.reason;link($("article"),data.url);
 $("matchlist").replaceChildren();
 const matches=data.matches||[];
 $("matches").hidden=!matches.length||data.status!=="pending";
 for(const m of matches){const p=document.createElement("p");const a=document.createElement("a");a.textContent=m.title+" — "+m.source+(m.published?"":" (oculta)");a.target="_blank";a.rel="noopener noreferrer";link(a,m.url);if(a.hidden){a.hidden=false;a.removeAttribute("href")}p.append(a);$("matchlist").append(p)}
 $("state").textContent=({pending:"Pendent de la teva decisió",published:"Publicada al feed",already_published:"Ja estava publicada. No s’ha creat cap duplicat.",kept_discarded:"Es manté descartada. No tornaràs a rebre l’avís."})[data.status]||data.status;
 $("actions").hidden=data.status!=="pending";
 if(data.needs_confirmation)$("error").textContent="Revisa les coincidències i marca la casella abans de publicar.";
}
function finishDirectDiscard(data){
 if(directAction!=="discard"||data.status!=="kept_discarded")return;
 $("title").textContent="Descartada ✓";
 $("meta").textContent="";
 $("dates").textContent="";
 $("context").textContent="";
 $("reason").textContent="La notícia es manté descartada.";
 $("article").hidden=true;
 $("matches").hidden=true;
 $("actions").hidden=true;
 $("state").textContent="Decisió desada. Aquesta pestanya es tancarà automàticament si el navegador ho permet.";
 setTimeout(()=>{
   try{window.close()}catch{}
   setTimeout(()=>{
     if(!window.closed && history.length>1){
       try{history.back()}catch{}
     }
   },180);
 },420);
}
async function call(action){
 $("error").textContent="";$("publish").disabled=$("discard").disabled=true;
 try{
 const res=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,token,action,confirm:$("confirm").checked})});
 const data=await res.json();if(!res.ok)throw new Error(data.error||"No s’ha pogut completar l’acció");
 render(data);
 finishDirectDiscard(data);
 }catch(e){$("error").textContent=e.message;if(action==="read")$("title").textContent="No s’ha pogut obrir la revisió"}
 finally{$("publish").disabled=$("discard").disabled=false}
}
$("publish").onclick=()=>call("publish");$("discard").onclick=()=>call("discard");
if(/^[0-9a-f-]{36}$/.test(id||"")&&/^[0-9a-f]{64}$/.test(token||"")){
  if(directAction==="publish"||directAction==="discard"){
    $("title").textContent=directAction==="publish"?"Publicant la notícia…":"Desant la decisió…";
    $("confirm").checked=true;
    call(directAction);
  }else call("read");
}
else{$("title").textContent="Obre l’enllaç del correu";$("reason").textContent="Cada avís conté un enllaç privat per revisar aquella notícia."}
</script></body></html>
