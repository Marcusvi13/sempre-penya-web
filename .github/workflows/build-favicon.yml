name: Genera favicon Penya

on:
  push:
    paths:
      - '.github/workflows/build-favicon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepara Pillow
        run: python -m pip install --quiet pillow

      - name: Genera favicon específic
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          GREEN = '#005441'
          src = Image.open('cjb_logo.png').convert('RGBA')

          # Retalla només marges realment transparents, sense deformar l'escut.
          alpha = src.getchannel('A')
          bbox = alpha.getbbox()
          if bbox:
              src = src.crop(bbox)

          def make_icon(size, logo_w_ratio=0.56, logo_h_ratio=0.72, ring_ratio=0.035):
              canvas = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              draw = ImageDraw.Draw(canvas)

              pad = max(1, round(size * 0.07))
              ring = max(1, round(size * ring_ratio))
              draw.ellipse(
                  (pad, pad, size - pad - 1, size - pad - 1),
                  fill='white',
                  outline=GREEN,
                  width=ring,
              )

              max_w = max(1, round(size * logo_w_ratio))
              max_h = max(1, round(size * logo_h_ratio))
              scale = min(max_w / src.width, max_h / src.height)
              w = max(1, round(src.width * scale))
              h = max(1, round(src.height * scale))
              logo = src.resize((w, h), Image.Resampling.LANCZOS)

              x = (size - w) // 2
              y = (size - h) // 2
              canvas.alpha_composite(logo, (x, y))
              return canvas

          make_icon(64).save('favicon-64.png', optimize=True)
          make_icon(32).save('favicon-32.png', optimize=True)
          make_icon(180, logo_w_ratio=0.58, logo_h_ratio=0.74).save('apple-touch-icon.png', optimize=True)

          print('Font:', Image.open('cjb_logo.png').size)
          print('Favicon: cercle blanc + anell verd #005441 + escut centrat i reduït')
          PY

      - name: Conserva els favicons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add favicon-32.png favicon-64.png apple-touch-icon.png
          if git diff --cached --quiet; then
            echo 'Sense canvis.'
          else
            git commit -m 'Genera favicon Penya més compacte'
            git push
          fi
