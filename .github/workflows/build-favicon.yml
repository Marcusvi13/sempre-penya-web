name: Genera favicon Penya

on:
  push:
    paths:
      - '.github/workflows/build-favicon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepara Pillow
        run: python -m pip install --quiet pillow

      - name: Genera favicon específic
        run: |
          python - <<'PY'
          from PIL import Image

          src = Image.open('cjb_logo.png').convert('RGBA')

          # Retalla únicament el marge transparent original.
          alpha = src.getchannel('A')
          bbox = alpha.getbbox()
          if bbox:
              src = src.crop(bbox)

          def make_icon(size, logo_w_ratio=0.40, logo_h_ratio=0.78):
              # Fons transparent: només l'escut, sense cercle exterior.
              canvas = Image.new('RGBA', (size, size), (0, 0, 0, 0))

              max_w = max(1, round(size * logo_w_ratio))
              max_h = max(1, round(size * logo_h_ratio))
              scale = min(max_w / src.width, max_h / src.height)
              w = max(1, round(src.width * scale))
              h = max(1, round(src.height * scale))
              logo = src.resize((w, h), Image.Resampling.LANCZOS)

              # Centrat, amb una lleugera compensació vertical perquè visualment
              # quedi equilibrat dins la pestanya del navegador.
              x = (size - w) // 2
              y = (size - h) // 2
              canvas.alpha_composite(logo, (x, y))
              return canvas

          make_icon(64, 0.40, 0.80).save('favicon-64.png', optimize=True)
          make_icon(32, 0.38, 0.78).save('favicon-32.png', optimize=True)
          make_icon(180, 0.44, 0.82).save('apple-touch-icon.png', optimize=True)

          print('Favicon: escut sol, transparent, clarament més estret i amb més aire lateral')
          PY

      - name: Conserva els favicons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add favicon-32.png favicon-64.png apple-touch-icon.png
          if git diff --cached --quiet; then
            echo 'Sense canvis.'
          else
            git commit -m 'Genera favicon Penya estret i sense cercle'
            git push
          fi
