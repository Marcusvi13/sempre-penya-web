<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Revisió ràpida · Sempre Penya</title>
<style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#182820;background:#f1f4f2}
*{box-sizing:border-box}body{margin:0}main{max-width:840px;margin:0 auto;padding:16px}
header{background:#086735;color:white;border-radius:16px;padding:22px;margin-bottom:14px}
h1{font-size:1.55rem;margin:4px 0 8px}h2{font-size:1.02rem;line-height:1.4;margin:6px 0}
header p{margin:0;opacity:.9;font-size:.9rem}p{line-height:1.5}
.card{background:white;padding:17px;border-radius:12px;border:1px solid #dce5df;margin:12px 0}
.meta{font-size:.82rem;color:#5b6b61}.why{font-size:.87rem;color:#475a50;background:#f4f7f4;padding:9px 11px;border-radius:8px}
.choice{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0 6px}
.pair-group{border:1px solid #accbb7;background:#f1f8f3;padding:11px;border-radius:10px;margin:12px 0}
.pair-group .meta{margin:0 0 5px;font-weight:650}
.pair-group select{background:#fff}
.pair-group label.check{display:block;margin:12px 0 4px;font-weight:650}
.pair-group[hidden]{display:none}
.choice label{display:flex;gap:6px;align-items:center;background:#edf3ef;border:1px solid #d4e2d8;border-radius:9px;padding:9px;cursor:pointer;flex:1;min-width:115px}
.choice label:has(input:checked){background:#e0f0e6;border-color:#086735}
.choice label:last-child:has(input:checked){background:#f5e8e8;border-color:#9b4b4b}
button,select,textarea{font:inherit}select,textarea{width:100%;padding:9px;border:1px solid #aebeb3;border-radius:7px;margin-top:8px}
textarea{min-height:65px;resize:vertical}label.check{display:block;font-size:.85rem;margin-top:8px}
small{font-size:.8rem}a{color:#086735}button{border:0;background:#086735;color:white;padding:13px 17px;border-radius:9px;font-weight:750;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
footer{position:sticky;bottom:0;background:#f1f4f2ee;border-top:1px solid #d0dbd2;padding:11px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
.status{font-size:.83rem;color:#435a4b}
.footer-feedback{flex:1;min-width:0;line-height:1.4}
.save-feedback{font-size:.86rem;font-weight:700;margin-top:3px}
.save-feedback:empty{display:none}
.save-feedback.busy{color:#435a4b}
.save-feedback.success{color:#086735}
.save-feedback.error{color:#a12121}
.error{color:#a12121}.success{color:#086735}.done{opacity:.7}.done select,.done textarea,.done .choice{display:none}
details{font-size:.83rem}summary{cursor:pointer;color:#245d3e}
@media(max-width:520px){main{padding:8px}.card{padding:13px}.choice label{font-size:.83rem;min-width:100px;padding:8px}header{border-radius:9px}footer{padding:10px}}
</style>
</head>
<body>
<main>
<header>
<small>SEMPRE PENYA</small>
<h1>Revisió ràpida de descartades</h1>
<p>Decideix des d'un únic lloc sense haver d'obrir les notícies. Només es desaran les peces que marquis.</p>
</header>
<p id="notice" role="status" aria-live="polite">Carregant les peces del correu…</p>
<section id="items" aria-label="Notícies per revisar"></section>
<footer>
<div class="footer-feedback">
  <div class="status" id="counter">Sense decisions</div>
  <div id="saveFeedback" class="save-feedback" role="status" aria-live="polite" aria-atomic="true"></div>
</div>
<button id="save" disabled>Desa les decisions</button>
</footer>
</main>
<script src="editorial-reasons.js?v=1"></script>
<script>
"use strict";
const endpoint="https://busuaaaamcojjtavhrne.supabase.co/functions/v1/radar-discard-review";
const ID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
const TOKEN=/^[0-9a-f]{64}$/;
const $=id=>document.getElementById(id);
const focus=new URLSearchParams(location.search).get("focus")||"";
const preset=new URLSearchParams(location.search).get("decision")||"";
const entries=location.hash.slice(1).split("~").map(x=>x.split(".")).filter(x=>ID.test(x[0]||"")&&TOKEN.test(x[1]||""));
const unique=new Map(entries.map(x=>[x[0],{id:x[0],token:x[1],data:null,error:"",busy:false}]));
const items=[...unique.values()].slice(0,25);
let saving=false,allSaved=false;
history.replaceState(null,"",location.pathname+location.search);
const reasons=window.PENYA_EDITORIAL_REASONS;
function el(tag,cls,content){const e=document.createElement(tag);if(cls)e.className=cls;if(content!=null)e.textContent=content;return e}
function add(parent,child){parent.append(child);return child}
function fmt(raw){if(!raw)return "Desconeguda";const v=new Date(raw);return isNaN(v.getTime())?"Desconeguda":v.toLocaleString("ca-ES",{timeZone:"Europe/Madrid",dateStyle:"short",timeStyle:"short"})}
function platform(d){return String(d?.source||"").endsWith(" · X")?"x":String(d?.source||"").endsWith(" · Instagram")?"instagram":""}
function family(d){
 const source=String(d?.source||"");
 if(source==="Club Joventut Badalona · X"||source==="Club Joventut Badalona · Instagram")return "penya";
 if(source==="Esports BDN Comunicació · X"||source==="Esports BDN Comunicació · Instagram")return "bdn-esports";
 if(source==="Badalona Comunicació · X"||source==="Badalona Comunicació · Instagram")return "bdn-general";
 return "";
}
function partnersFor(item){
 const d=item.data;
 const time=Date.parse(d?.published_at||"");
 if(!family(d)||!platform(d)||!Number.isFinite(time))return [];
 return items.filter(other=>{
  if(other.id===item.id||other.data?.status!=="pending")return false;
  const b=other.data,when=Date.parse(b.published_at||"");
  return family(b)===family(d)&&platform(b)&&platform(b)!==platform(d)
    &&Number.isFinite(when)&&Math.abs(when-time)<=12*3600000;
 });
}
function onlyHiddenPairMatches(item,relatedId){
 const related=unique.get(relatedId);
 const a=item?.data,b=related?.data;
 const matches=Array.isArray(a?.matches)?a.matches:[];
 if(!relatedId||!a||!b||a.status!=="pending"||b.status!=="pending"||
    !matches.length||family(a)!==family(b)||platform(a)===platform(b))return false;
 // A prior test may have left one of THESE two URLs in the feed, hidden.
 // Different, visible or third-party matches still demand human approval.
 return matches.every(m=>m.published===false &&
   (m.url===a.url||m.url===b.url));
}
function pendingCount(){return document.querySelectorAll(".card:not(.done) input[value='publish']:checked,.card:not(.done) input[value='discard']:checked").length}
function setFeedback(message,kind=""){
 const box=$("saveFeedback");
 box.className="save-feedback"+(kind?" "+kind:"");
 box.textContent=message;
}
function refresh(){
 const n=pendingCount();
 $("counter").textContent=n ? n+" decisió"+(n===1?"":"ns")+" seleccionada"+(n===1?"":"es")+" per desar" : "Cap decisió seleccionada (Omet no desa res)";
 $("save").disabled=saving||!n;
 $("save").textContent=saving?"Desant…":n?"Desa "+n+" decisió"+(n===1?"":"ns"):allSaved?"✓ Tot desat":"Desa les decisions";
}
async function api(item,action,opts={}){const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},cache:"no-store",body:JSON.stringify({id:item.id,token:item.token,action,...opts})});const data=await r.json();if(!r.ok||data?.error)throw Error(data?.error||"Error de connexió");return data}
function build(item,i){
 const d=item.data,card=el("article","card");card.dataset.id=item.id;
 const meta=add(card,el("div","meta",(i+1)+" / "+items.length+" · "+(d.source||"Font desconeguda")));
 add(card,el("h2","",d.title||"Peça sense titular"));
 add(card,el("p","meta","Publicada: "+fmt(d.published_at)+" · Detectada: "+fmt(d.first_detected_at)));
 if(d.context)add(card,el("p","",d.context));
 add(card,el("p","why","Motiu automàtic: "+(d.reason||"No detallat")));
 const related=el("p","meta");
 if(/^https?:\/\//.test(d.url||"")){const link=add(related,el("a","","Original (opcional)"));link.href=d.url;link.target="_blank";link.rel="noopener noreferrer";}
 add(card,related);
 const existing=Array.isArray(d.matches)?d.matches:[];
 if(existing.length){const det=add(card,el("details",""));add(det,el("summary","",existing.length+" coincidència/es al feed. Revisa-les abans de publicar."));existing.slice(0,7).forEach(x=>add(det,el("p","meta",(x.title||"")+(x.published?" (visible)":" (oculta)"))));}
 const already=d.status!=="pending";
 if(already){card.classList.add("done");add(card,el("p","success","Ja revisada: "+d.status));return card;}
 const choices=add(card,el("div","choice"));choices.setAttribute("role","group");
 const radios=[];
 for(const [value,label] of [["","Omet (no modifica la proposta)"],["publish","Publica"],["discard","Descarta"]]){
  const w=add(choices,el("label",""));const radio=add(w,el("input",""));radio.type="radio";radio.name="decision-"+i;radio.value=value;radio.checked=value==="";add(w,el("span","",label));radios.push(radio);
 }
 const eligible=partnersFor(item);
 const pairWrap=add(card,el("div","pair-group"));pairWrap.hidden=true;
 add(pairWrap,el("p","meta","Hi ha una publicació de l'altra xarxa pendent. Tria expressament com vols publicar:"));
 const pairSelect=add(pairWrap,el("select",""));
 pairSelect.add(new Option("— Tria agrupar o publicar només aquesta peça —",""));
 for(const other of eligible){
  const d=other.data;
  pairSelect.add(new Option((platform(d)==="x"?"X":"Instagram")+" · "+String(d.title||"Publicació").slice(0,90),other.id));
 }
 pairSelect.add(new Option("Publicar NOMÉS aquesta peça (sense agrupar)","solo"));
 const soloConfirmWrap=add(pairWrap,el("label","check"));soloConfirmWrap.hidden=true;
 const soloConfirm=add(soloConfirmWrap,el("input",""));soloConfirm.type="checkbox";
 add(soloConfirmWrap,el("span",""," Confirmo que vull publicar només aquesta xarxa i NO agrupar l'altra proposta."));
 const pairConfirmWrap=add(pairWrap,el("label","check"));pairConfirmWrap.hidden=true;
 const pairConfirm=add(pairConfirmWrap,el("input",""));pairConfirm.type="checkbox";
 add(pairConfirmWrap,el("span",""," Confirmo que són la mateixa notícia: publicar UNA entrada amb els botons X i Instagram. L'altra proposta quedarà resolta com a agrupada."));
 pairSelect.addEventListener("change",()=>{
  pairConfirm.checked=false;
  pairConfirmWrap.hidden=!pairSelect.value||pairSelect.value==="solo";
  soloConfirmWrap.hidden=pairSelect.value!=="solo";
  soloConfirm.checked=false;
  updateDuplicateConfirmation();
  allSaved=false;setFeedback("");
 });
 const reason=add(card,el("select",""));reason.hidden=true;reason.required=true;
 const other=add(card,el("textarea",""));other.hidden=true;other.maxLength=1000;other.placeholder="Explica breument el motiu";
 add(card,el("p","meta","Les coincidències amb altres notícies es comproven automàticament: no cal cap confirmació addicional."));
 const priorHiddenInfo=add(card,el("p","meta","La coincidència detectada correspon a una d'aquestes dues peces que ja estava oculta. Es reaprofitarà en una sola notícia; no cal confirmar-la com un duplicat nou."));
 priorHiddenInfo.hidden=true;
 function updateDuplicateConfirmation(){
  const action=radios.find(x=>x.checked)?.value||"";
  const hiddenPair=action==="publish"&&onlyHiddenPairMatches(item,pairSelect.value);
  priorHiddenInfo.hidden=!hiddenPair;
  // La verificació de duplicats es fa al servidor.
 }
 const status=add(card,el("p","status"));status.setAttribute("role","status");
 function change(){
  if(!saving){allSaved=false;setFeedback("");}
  const action=radios.find(x=>x.checked)?.value||"";
  pairWrap.hidden=action!=="publish"||!eligible.length;
  if(action!=="publish"){pairSelect.value="";pairConfirm.checked=false;soloConfirm.checked=false;pairConfirmWrap.hidden=true;soloConfirmWrap.hidden=true;}
  reason.hidden=!action;reason.replaceChildren();
  if(action)reason.add(new Option("Tria un motiu…",""));
  for(const [code,label] of reasons[action]||[]){const option=new Option(label,code);reason.add(option);}
  other.hidden=true;
  updateDuplicateConfirmation();
 
  refresh();
 }
 radios.forEach(r=>r.addEventListener("change",change));
 reason.addEventListener("change",()=>{other.hidden=reason.value!=="other"});
 if(item.id===focus&&["publish","discard"].includes(preset)){const selected=radios.find(r=>r.value===preset);if(selected){selected.checked=true;change();card.style.border="2px solid #086735";}}
 card._payload=()=>({
  action:radios.find(x=>x.checked)?.value||"",
  reason_code:reason.value||"",
  reason_text:other.value.trim(),
  confirm:false,
  related_id:pairSelect.value && pairSelect.value!=="solo"?pairSelect.value:"",
  related_token:pairSelect.value && pairSelect.value!=="solo"?(unique.get(pairSelect.value)?.token||""):"",
  confirm_pair:pairConfirm.checked,
  pair_required:eligible.length>0,
  pair_choice:pairSelect.value,
  publish_solo_confirm:soloConfirm.checked
 });
 card._status=status;
 return card;
}
async function load(){
 if(!items.length){$("notice").textContent="No hem trobat cap identificador vàlid. Obre el botó «Revisa totes» del correu.";return}
 const results=await Promise.all(items.map(async item=>{try{item.data=await api(item,"read")}catch(e){item.error=String(e.message||e)}return item}));
 $("items").replaceChildren();
 let ok=0;
 for(let i=0;i<results.length;i++){const item=results[i];if(item.data){add($("items"),build(item,i));ok++}else{const box=add($("items"),el("div","card"));add(box,el("p","error","Peça "+(i+1)+": "+item.error));}}
 $("notice").textContent=ok+" peces carregades · les decisions no s'apliquen fins que prems «Desa».";
 refresh();
 if(focus){const card=[...document.querySelectorAll(".card")].find(c=>c.dataset.id===focus);if(card)card.scrollIntoView({behavior:"instant",block:"center"});}
}
$("save").onclick=async()=>{
 if(saving)return;
 const changes=[...document.querySelectorAll(".card")].filter(c=>c._payload&&c._payload().action);
 if(!changes.length)return;
 saving=true;allSaved=false;
 refresh();
 setFeedback("Desant les decisions… 0 de "+changes.length+" confirmades","busy");
 let done=0,errors=0;
 try{
  for(let i=0;i<changes.length;i++){
   const card=changes[i],item=unique.get(card.dataset.id),p=card._payload();
   setFeedback("Desant… "+(i+1)+" de "+changes.length+" · "+done+" confirmades","busy");
   if(!p.reason_code){card._status.textContent="Tria un motiu abans de desar.";card._status.className="error";errors++;continue;}
    if(p.reason_code==="other"&&!p.reason_text){card._status.textContent="Cal explicar el motiu personalitzat.";card._status.className="error";errors++;continue;}
   if(p.action==="publish"&&p.pair_required&&!p.pair_choice){
     card._status.textContent="Tria explícitament agrupar X i Instagram o publicar només una xarxa.";
     card._status.className="error";errors++;continue;
   }
   if(p.action==="publish"&&p.pair_choice==="solo"&&!p.publish_solo_confirm){
     card._status.textContent="Confirma que vols publicar una sola xarxa.";
     card._status.className="error";errors++;continue;
   }
   if(p.action==="publish"&&p.related_id){
     if(!p.confirm_pair){card._status.textContent="Confirma que les dues publicacions són la mateixa notícia.";card._status.className="error";errors++;continue;}
     const partnerCard=[...document.querySelectorAll(".card")].find(c=>c.dataset.id===p.related_id);
     if(!partnerCard||partnerCard.classList.contains("done")||partnerCard._payload?.().action){
       card._status.textContent="L'altra proposta també té una decisió marcada. Deixa-la a «Omet» per agrupar-la.";card._status.className="error";errors++;continue;
     }
   }
   try{
    const d=await api(item,p.action==="publish"&&p.related_id?"publish_pair":p.action,p);
    if(d.needs_confirmation){card._status.textContent="No s'ha publicat: existeix una altra notícia coincident. Evitem crear duplicats.";card._status.className="error";errors++;continue;}
    // Un HTTP 200 amb estat 'pending' NO significa que s'hagi desat.
    const accepted=p.action==="publish"
      ?["published","already_published"].includes(d.status)
      :d.status==="kept_discarded";
    if(!accepted)throw Error("El servidor no ha confirmat la decisió. Estat: "+(d.status||"desconegut"));
    if(p.related_id&&p.action==="publish"&&!d.paired){
      throw Error("No s'ha confirmat l'agrupació dels dos enllaços.");
    }
    card.classList.add("done");
    card._status.textContent=d.paired?"Publicada UNA notícia amb X + Instagram":"Desat: "+d.status;
    card._status.className="success";done++;
    if(d.paired){
      const partnerCard=[...document.querySelectorAll(".card")].find(c=>c.dataset.id===p.related_id);
      if(partnerCard){
        partnerCard.classList.add("done");
        partnerCard._status.textContent="Agrupada a la notícia publicada (sense crear-ne una altra).";
        partnerCard._status.className="success";
      }
    }
   }catch(e){card._status.textContent="No confirmat: "+String(e.message||e);card._status.className="error";errors++;}
  }
 }catch(e){
  // Protecció addicional per a errors imprevistos del navegador.
  errors++;
  $("notice").textContent="Incidència al processament: "+String(e.message||e);
 }finally{
  saving=false;
  allSaved=done>0&&errors===0;
  if(!errors){
   const success=done+" decisió"+(done===1?"":"ns")+" desada"+(done===1?"":"es")+" correctament.";
   $("notice").textContent=success;
   setFeedback("✓ "+success,"success");
  }else{
   $("notice").textContent=done+" decisions confirmades; "+errors+" pendents de revisió.";
   setFeedback("✓ "+done+" desades · "+errors+" per revisar. Torna-ho a provar si cal.","error");
  }
  refresh();
 }
};
load();
</script>
</body></html>
